
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-gitops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/seannez/exco-gitops-lab.git
    targetRevision: main
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
